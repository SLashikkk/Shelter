<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our pets</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pets.css" />
    <link rel="icon" type="image/x-icon" href="./icon/icon.ico" />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <div class="header__logo">
          <a href="main.html">
            <h1 class="logo__title">Cozy House</h1>
            <p class="logo__subtitle">Shelter for pets in Boston</p>
          </a>
        </div>
        <nav class="header__menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="main.html" class="menu__link"
                >About the shelter</a
              >
            </li>
            <li class="menu__item">
              <a href="#our-friends" class="menu__link menu__link--active">Our pets</a>
            </li>
            <li class="menu__item">
              <a href="main.html#help" class="menu__link">Help the shelter</a>
            </li>
            <li class="menu__item">
              <a href="#in-addition" class="menu__link">Contacts</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <footer class="footer" id="contacts">
      <div class="container footer__container">
        <div class="footer__contacts">
          <h5 class="footer__title">For questions and suggestions</h5>
          <a href="mailto:email@shelter.com" class="footer__link">
            <img class="footer__icon" src="./svg/mail.svg" alt="mail" />
            <span class="footer__text">email@shelter.com</span>
          </a>
          <a href="tel:+136745677554" class="footer__link">
            <img class="footer__icon" src="./svg/phone.svg" alt="phone" />
            <span class="footer__text">+13 674 567 75 54</span>
          </a>
        </div>
        <div class="footer__locations">
          <h5 class="footer__title footer__title--mobile">
            We are waiting for your visit
          </h5>
          <a
            href="https://www.google.com/maps/"
            target="_blank"
            class="footer__link"
          >
            <img class="footer__icon" src="./svg/pin.svg" alt="footer icon" />
            <span class="footer__text"
              >1 Central Street, Boston (entrance from the store)</span
            >
          </a>
          <a
            href="https://www.google.com/maps/"
            target="_blank"
            class="footer__link"
          >
            <img class="footer__icon" src="./svg/pin.svg" alt="footer icon" />
            <span class="footer__text">18 South Park, London</span>
          </a>
        </div>
        <div class="footer__image-wrapper">
          <img src="./img/footer-puppy.png" alt="footer sleeping puppy" />
        </div>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
